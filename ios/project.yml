name: ArmaSnake
options:
  bundleIdPrefix: com.aistudio
  deploymentTarget:
    iOS: "15.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
targets:
  ArmaSnake:
    type: application
    platform: iOS
    sources:
      - path: ArmaSnake
      # Same audio/video files as the Android app.
      - path: ../app/src/main/res/raw/arma_snake.mp3
        buildPhase: resources
      - path: ../app/src/main/res/raw/stage_transition.mp3
        buildPhase: resources
      - path: ../app/src/main/res/raw/louffi_edition_logo_intro_animation_202609082217.mp4
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.armadilloescape.xwqrpz
        PRODUCT_NAME: ArmaSnake
        INFOPLIST_FILE: ArmaSnake/Info.plist
        MARKETING_VERSION: "2.1.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # Kotlin/Compose game, built by Gradle (ios/shared) before xcodebuild.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/shared/build/bin/iosSimulatorArm64/debugFramework
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/shared/build/bin/iosArm64/releaseFramework
        OTHER_LDFLAGS: ["-ObjC", "-framework", "ArmaShared"]
        # Keep Xcode's DEBUG=1 macro away from the Kotlin header.
        GCC_PREPROCESSOR_DEFINITIONS: ""
schemes:
  ArmaSnake:
    build:
      targets:
        ArmaSnake: all
    run:
      config: Debug
    archive:
      config: Release
