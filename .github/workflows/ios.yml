name: iOS build

on:
  push:
    branches: [ios]
    paths: ['ios/**', 'app/src/main/java/**', 'app/src/main/res/raw/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }

      - name: Build Kotlin/Compose game frameworks
        run: |
          gradle -p ios --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkReleaseFrameworkIosArm64 2>&1 | tee kotlin.log
          test ${PIPESTATUS[0]} -eq 0 || { grep -E "^e: " kotlin.log | head -60; exit 1; }

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app for simulator
        run: |
          cd ios
          xcodebuild -project ArmaSnake.xcodeproj -scheme ArmaSnake \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > xcode-sim.log 2>&1 \
            || { grep -E "error:|Undefined symbol|ld: " xcode-sim.log | head -60;
                 grep -oE "ArmaShared.h:[0-9]+" xcode-sim.log | sort -u | cut -d: -f2 | while read n; do
                   echo "--- header line $n"; sed -n "$((n-2)),$((n+1))p" shared/build/bin/iosSimulatorArm64/debugFramework/ArmaShared.framework/Headers/ArmaShared.h; done
                 exit 1; }
          tail -n 3 xcode-sim.log

      - name: Run in simulator and take screenshots
        run: |
          set -euo pipefail
          APP=ios/build/sim/Build/Products/Debug-iphonesimulator/ArmaSnake.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in sorted(d,reverse=True) if 'iOS' in r for x in d[r] if 'Pro Max' in x['name']))")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          PID=$(xcrun simctl launch "$UDID" com.aistudio.armadilloescape.xwqrpz | awk '{print $NF}')
          echo "pid $PID"
          sleep 12; xcrun simctl io "$UDID" screenshot shots/01-intro.png
          sleep 18; xcrun simctl io "$UDID" screenshot shots/02-menu.png
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "armadilloescape"; then echo "APP RUNNING"; else echo "APP NOT RUNNING"; fi
          find ~/Library/Logs/DiagnosticReports -name "ArmaSnake*" -newer "$APP" -exec cat {} \; | head -120 || true
          for f in shots/*.png; do
            sips -r 270 "$f" >/dev/null
            sips -Z 640 -s format jpeg -s formatOptions 55 "$f" --out /tmp/p.jpg >/dev/null
            echo "PREVIEW $(basename "$f") $(base64 -i /tmp/p.jpg | tr -d '\n')"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: |
            shots/
            ios/xcode-sim.log
          retention-days: 14

      - name: Build unsigned device .ipa (sign with Sideloadly)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild -project ArmaSnake.xcodeproj -scheme ArmaSnake \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ArmaSnake.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive > xcode-dev.log 2>&1 \
            || { grep -E "error:|Undefined symbol|ld: " xcode-dev.log | head -60; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R build/ArmaSnake.xcarchive/Products/Applications/ArmaSnake.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../ARMASNAKE-unsigned.ipa Payload)
          ls -la build/ARMASNAKE-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ARMASNAKE-ipa
          path: ios/build/ARMASNAKE-unsigned.ipa
          retention-days: 30
