name: Publish iOS ipa to branch

on:
  workflow_dispatch:
  push:
    branches: [ios]
    paths: ['.github/workflows/ios-ipa-to-branch.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the latest successful iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/ios.yml/runs?branch=ios&status=success&per_page=1" --jq '.workflow_runs[0].id')
          echo "run $RUN"
          gh run download "$RUN" -R "${{ github.repository }}" -n ARMASNAKE-ipa -D out
          ls -la out
      - name: Push to branch ios-ipa
        run: |
          cd out
          git init -q -b ios-ipa
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ARMASNAKE-unsigned.ipa
          git commit -qm "ARMASNAKE unsigned iOS build"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-ipa
