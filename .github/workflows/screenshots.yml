name: Build & visual screenshots

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compile app
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Unit tests + record screenshots
        run: gradle :app:recordRoborazziDebug --stacktrace --continue

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            app/src/test/screenshots/**
            app/build/outputs/roborazzi/**
          if-no-files-found: warn

      - name: Publish screenshots to a preview branch
        if: always() && github.event_name != 'pull_request'
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/app/src/test/screenshots"
          [ -d "$SRC" ] || exit 0
          TMP=$(mktemp -d)
          cp -r "$SRC"/. "$TMP"/
          cd "$TMP"
          git init -q
          git checkout -q -b "ci-shots/${GITHUB_REF_NAME}"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/ci-shots/${GITHUB_REF_NAME}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/**
