name: iOS Kotlin check

on:
  push:
    branches: [ios]
    paths: ['ios/**', 'app/src/main/java/**', '.github/workflows/ios-kotlin-check.yml']
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compile shared game code for iOS (klib)
        run: gradle -p ios --no-daemon :shared:compileKotlinIosSimulatorArm64 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Errors
        if: failure()
        run: grep -E "^e: |error:" build.log | head -80
